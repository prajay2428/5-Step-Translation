    Now as you are transcribing,
    Point 1: Marking the Pauses with … or ,
    When  a sentence is made of blocks of information, if there is significant pause (more than 600 milliseconds) in speech add … to indicate that pause in speech.
    Example: There is a beautiful ... incident that occurred ... around Ashtavakra.
    
    When  a sentence is made of blocks of information, if there is a pause that is not significant (less than 600 milliseconds) in speech add , to indicate that non-significant pause in speech.
    Example: Up to four days, or to be safe up to five days, one can wait. 
    
    Point 2:
    If the pause is not significant (less than 600 milliseconds), but the information block is an additional information to the main idea, in such cases add a - infront of that block of information (and at the end if there is another block after this block - Which is a part of the main idea and which completes the main idea)
    Example 1:

    Example :2

    Point 3:

stick to the same sequence and pauses between the segments, thoughts and ideas.

Translation Need 2:
Polishing the Script into a day to day spoken style:
The Challenge here is, as we try to keep the information conveyed in the same timing, length and order - Because of the structural difference between English and Telugu Languages - Some sentences in the script came like broken pieces. For example, let us say there are two blocks. In natural English Flow it is Block A followed by block B. And to maintain the sequence we placed it as Block A followed by block B In telugu translation also. But in natural telugu flow, it makes a complete thought when it is Actually Block  B followed by Block A. But Video syncing is important, So we are keeping it as block A followed by Block B in telugu also.
    
Now your job is, let us say you are someone who is well versed in general day to day spoken telugu.

    ఈ రోజు మీరు ఒక రైలు తగలబడటం చూసి, ఫైర్‌ఫైటర్ అవ్వాలనుకుంటారు; రేపు ఇంకేదో చూసి, అది అవ్వాలనుకుంటారు. భావోద్వేగ ప్రతిస్పందనతో, ఏదో ఒకటి అవ్వాలని మీరు ఎంచుకుంటారు; అది ఒక స్థాయిలో ఉపయోగపడొచ్చు. కానీ ఇప్పుడు, చాలా మంది యువకులు ఆలోచించలేని ఈ సమయంలో, మీరు, ‘నా జీవితంతో నేనేం చేయాలి?’ అని ఆలోచిస్తున్నారు. అలాంటి ఆలోచన వచ్చినప్పుడు, నేను చెప్పేది ఏంటంటే - దానిపై మరికొంత సమయం గడపాలి; ఎవరివల్లా, దేనివల్లా ప్రభావితం కాకుండా, కేవలం ఇలా చూడండి - “మానవాళికి అత్యంత అవసరమైనది ఏంటి? ఈ రోజు ప్రపంచానికి అత్యంత అవసరమైనది ఏంటి?” - దాన్ని మీరు గుర్తించాలి.
    ఈ గ్రహం మీద సరిచేయాల్సిన ఏకైక విషయం మనుషులే; మిగతాదంతా బాగానే ఉంది, కదా? కాబట్టి, నేను చెప్పేది, యువకులందరూ - కేవలం మీరు మాత్రమే కాదు - మీరు చేస్తున్న దాని నుండి ఒక విరామం తీసుకోవాలి. 
    మీరు ఎందుకిలా ఇరుక్కుపోయారంటే - స్కూల్ చేశారు, కాలేజీకి వెళ్లారు, అది చేశారు కాబట్టి, దాని తర్వాత ఇంకోటి, ఆ తర్వాత మరొకటి - అలా వెళ్ళిపోయి, చివరికి ఒక PhD తో ముగిస్తారు... ఏం చేయాలి? అది ప్రమాదకరం, తెలుసా. ఎందుకంటే విద్యా శాస్త్రవేత్తలు ఏమంటున్నారంటే, మీరు 20 ఏళ్ళ సంప్రదాయ విద్య గుండా వెళ్ళి, ఒక PhD లాంటి దానితో స్థిరపడితే, అది మీ మేధస్సులో 70 శాతాన్ని శాశ్వతంగా నాశనం చేస్తుంది; మీరు చాలా జ్ఞానమున్న తెలివితక్కువ వాళ్ళుగా తయారవుతారు.
    ఇంకా ఈ రోజుల్లో జ్ఞానానికి విలువే లేదు; ఎందుకంటే ఒక PhD ఉన్నవాళ్ళకి ఏం తెలుసో, ఒక హైస్కూల్ పిల్లాడు కూడా ఇంటర్నెట్ చూసి అదే పరిభాష మాట్లాడగలడు. మీరు సేకరించిన ఈ జ్ఞానంతో... ఇకపై తెలివైనవారిగా కూడా కనిపించలేరు, కదా? ఎందుకంటే ఇంచుమించు ప్రతీ ఒక్కరూ ఈ విషయాలు మాట్లాడతారు - ఎందుకంటే అదంతా ఇప్పుడు ఎక్కడపడితే అక్కడ దొరుకుతోంది.
    కాబట్టి మీరు ఒక యూనివర్సిటీ కోసం సిద్ధమవుతున్నారా... లేక యూనివర్స్  కోసమా? మీరు జీవించాల్సింది అక్కడే. మీరు ఒక విద్యావేత్త అవ్వాలనుకుంటే తప్ప - నేను ఈ విషయాలు తప్పని చెప్పట్లేదు. కానీ తెలివైన వారు - తమ జీవితాన్ని అత్యంత అవసరమైన దాని వైపు వెచ్చించాలి, కదా? అంతేగాని, నేను చేయాలనుకుంటున్నాననో లేదా మీరు చేయాలనుకుంటున్నారనో - ఏదో ఒక ఫ్యాన్సీ విషయంపై కాదు.
    మీరు ఏ పనైనా - ఆనందంగా లేదా బాధగా చేయొచ్చు, కదా? కేవలం... 'ఇది చేస్తే నేను సంతోషంగా ఉంటాను' అని ఈ రోజు మీరు అనుకుంటున్నారు కాబట్టి, కొంత కాలం తర్వాత కూడా అదే పని చేయడం వల్ల మీరు సంతోషంగా ఉంటారని మాత్రం ఎప్పుడూ అనుకోవద్దు. ప్రతి ఒక్కరి జీవితంలోనూ, వాళ్లకి మొదటి ఉద్యోగం వచ్చినప్పుడు, అదెంత అద్భుతమైన రోజో కదా; మీరు ఆ పాత చింకి ఆఫీసుకి వెళ్లి, అక్కడ కూర్చుంటే, వావ్. ఎలా అనిపించి ఉంటుందో! 
    కానీ కొన్ని సంవత్సరాల తర్వాత, అదే టేబుల్ వెనుక కూర్చోవడం... మీ ప్రాణం తీస్తున్నట్టుగా ఉంటుంది; అదే ఉద్యోగం, అదే పెళ్లి, అవే పరిస్థితులు - మీ ప్రాణాన్ని తీస్తుంటాయి. ఒకప్పుడు స్వర్గంలా కనిపించినవే; కొంత కాలం తర్వాత నరకంలా కనిపిస్తాయి, కదా?
    ఆ ఉద్యోగాలలో ఏదో తప్పు ఉందని కాదు; కేవలం మీరు దాన్ని తప్పుడు కారణాలతో చేస్తున్నారు. మీరు వాటిని కేవలం తప్పుడు కారణాల కోసం చేస్తున్నారు, అంతే.
    ఇప్పుడు మీరు ఆలోచిస్తున్నారు కాబట్టి, నేను చెప్పేది - కొన్ని వారాలు విరామం తీసుకోమని; ఆ అవకాశం కల్పించడానికి మేము సిద్ధంగా ఉన్నాం. ఎవరి చేతా ప్రభావితం కాకుండా, కేవలం కూర్చుని, దాన్ని గమనించండి. తక్షణ అవసరాల కారణంగా, ఇప్పుడు మీరు చేయాలనుకునేవి చాలా ఉంటాయి - ప్రస్తుతం మీ దగ్గర డబ్బు లేదు; అందుకే మొదటి పని ఒక ఉద్యోగం వెతుక్కోవాలని అనుకుంటారు. లేదా మీలో ఉన్న మరేదైనా ఒత్తిడి వల్ల, ముందు ఇది చేయాలని అనుకుంటారు. మీ ఒత్తిడులను పక్కన పెడితే, ఒకవేళ మీకు ఈ ఒత్తిడులేవీ లేవనుకోండి, అప్పుడు జీవితంతో మీరేం చేయాలనుకుంటారు? మీరు చేయాల్సింది అదే.
    మీరు మీ జీవితాన్ని, మీ జీవిత గమనాన్ని తక్షణ అవసరాల ఆధారంగా నిర్ణయించుకోకూడదు; మీరు ఏది చేసినా, దాన్ని 100 సంవత్సరాలు చేశాక వెనక్కి తిరిగి చూసుకుంటే... ఆ 100 ఏళ్ల తర్వాత కూడా, ‘అది ఇంకా విలువైనదేనా?’ అని చూసుకోండి. అలాంటి దాన్నే మీరు చేయాలి. 
    
    మీలా ఉండాలని కోరుకునే వాళ్ళు ఇక్కడ చాలా మంది ఉన్నారు. 'అయ్యో, నేను 20 ఏళ్ల వయసులో ఉండి, ఏం చేయాలో ఆలోచించగలిగి ఉంటే ఎంత బాగుండేది. కానీ ఆ సమయంలో నేను ఏదో చేసేశాను.' అని అనుకునే వాళ్ళు ఇక్కడ ఎంతోమంది ఉన్నారు. ఇప్పుడు మీకు 20 ఏళ్లు, మీరు ఆలోచిస్తున్నారంటే అది మీ అదృష్టం, మీరు ఇక్కడ ఉండటం కూడా మీ అదృష్టం, కాబట్టి మీరు ఏదైనా చేసే ముందు సరిగ్గా ఆలోచించాల్సిన సమయం ఇది.
    
    Polished script:
    ప్రశ్న:
    నమస్కారం సద్గురు. నేను 20 ఏళ్ల యూనివర్సిటీ విద్యార్థిని;
    
    సద్గురు:
    క్షమించండి! 
    
    ప్రశ్న:
    నేను 20 ఏళ్ల యూనివర్సిటీ విద్యార్థిని; సత్యం, నిమగ్నత, పరిపూర్ణతతో కూడిన జీవితం కావాలనుకుంటున్నాను. నేనూ, నా వయసు వాళ్ళు... మా అంతర్గత మార్గాన్ని, బాహ్య ప్రపంచంతో ఎలా సమతుల్యం చేసుకోవాలి? అది మెడికల్ స్కూల్ కెళ్లడమైనా, ప్రొఫెషనల్ కెరీర్ అయినా, లేదా ఆశ్రమంలో ఎక్కువ సమయం గడపడమైనా!
    సద్గురు:
    చూడండి మనందరం ‘ఈ యూనివర్స్’లో జీవించాల్సిందే; ఈ విషయంలో ప్రస్తుతానికి వేరే ఎంపిక లేదు. 
    కానీ యూనివర్సిటీ అనేది ఎంపిక; అందుకే ఈ ప్రశ్న అడుగుతున్నారు - 'ఎంత సమయం కేటాయించాలి?!'
    కొన్ని పనులు చేసే విషయంలో ... చదువుకి విలువ ఉంటుంది. 
    కానీ, “జీవితంలో ఏం చేయాలి?! - ఒక మనిషిగా, ఒక తరం ప్రజలుగా? - మన జీవితాల్లో మనం ఏం చేయాలి?!”
    
    నేనేమంటానంటే  - ఒక యువకుడిగా, మీరు కళ్ళు తెరిచి ప్రపంచాన్ని పరిశీలించాలి.
    దయచేసి పరిశీలించండి - ప్రస్తుతం  ఈ ప్రపంచానికి అత్యవసరమైన విషయం ఏంటో చూడండి; మీకు నచ్చిందని ఏదో ఫ్యాన్సీ పని చేయడం కాదు, ఏది అత్యంత అవసరమో అది చేయాలి, అవునా? అవునా కాదా?
    పరిస్థితులకు లోనైపోతే, ప్రజలు ఇలా అవుతారు … 
    అది ఉపయోగకరమే, కానీ అది మౌలికమైనది కాదు. 
    ఈ రోజు ఓ రైలు తగలబడటం చూసి, ఫైర్‌ఫైటర్ అవ్వాలనుకుంటారు; రేపు ఇంకేదో చూసి, అది అవ్వాలనుకుంటారు. భావోద్వేగ ప్రతిస్పందనతో, ఏదో ఒకటి అవ్వాలని ఎంచుకుంటే, అది ఒక స్థాయిలో ఉపయోగపడొచ్చు; కానీ ఇప్పుడు, చాలా మంది యువకులు ఆలోచించలేనప్పుడు, మీరు ఆలోచిస్తున్నారు - ‘నా జీవితంతో నేనేం చేయాలి?’ అని!

  // --- START OF NEW LOGIC ---

  textContent = textContent.replace(/§§END§§(\s+)§§START§§/g, '$1');

function applyHighlight() {
  const box = document.getElementById('highlight-box');
  if (!box || !box.innerHTML.trim()) {
    showMessage('⚠️ Box is empty. Paste some content first.');
    return;
  }

  // The vibrant teal color you want to use.
  const highlightColor = '#9bf8ec'; 

  // --- Start of Final DOM-Based Logic ---

  // 1. Handle spans that are styled to be bold (the main case from Google Docs).
  // We get all spans inside the box to check them individually.
  const allSpans = Array.from(box.querySelectorAll('span'));

  allSpans.forEach(span => {
    // Check if the span's inline style makes it bold.
    if (span.style.fontWeight === 'bold' || parseInt(span.style.fontWeight) >= 700) {
      
      // SURGICAL MODIFICATION:
      // a) Un-bold the text by changing the inline style directly.
      span.style.fontWeight = 'normal';
      
      // b) Apply the highlight color by changing the inline style directly.
      // This will correctly override the "transparent" value from the paste.
      span.style.backgroundColor = highlightColor;
    }
  });

  // 2. Handle simple <b> and <strong> tags as a fallback.
  // This ensures text bolded in simpler editors also works.
  const boldTags = Array.from(box.querySelectorAll('b, strong'));
  boldTags.forEach(tag => {
    // a) Create a new span to replace the old bold tag.
    const newSpan = document.createElement('span');
    
    // b) Apply the highlight color directly to the new span's inline style.
    newSpan.style.backgroundColor = highlightColor;
    
    // c) Move the content from the old tag into the new span.
    newSpan.innerHTML = tag.innerHTML;
    
    // d) Replace the old tag with our new, styled span.
    tag.parentNode.replaceChild(newSpan, tag);
  });

  showMessage('✨ Bold text has been highlighted!');
}

// --- Scroll to Top Button Logic ---
// Wait for the DOM to be fully loaded before running this script
document.addEventListener('DOMContentLoaded', function() {
  const scrollToTopBtn = document.getElementById('scrollToTopBtn');

  // We must check if the button actually exists before adding listeners to it
  if (scrollToTopBtn) {
    // Show the button when the user scrolls down 200px from the top
   
    // Show the button by adding/removing the 'visible' class
    window.onscroll = function() {
      if (document.body.scrollTop > 200 || document.documentElement.scrollTop > 200) {
        scrollToTopBtn.classList.add("visible");
      } else {
        scrollToTopBtn.classList.remove("visible");
      }
    };

    // When the user clicks on the button, scroll to the first part smoothly
    scrollToTopBtn.addEventListener('click', () => {
      const firstPart = document.querySelector('.part1');
      if (firstPart) {
        firstPart.scrollIntoView({
          behavior: 'smooth',
          block: 'start'
        });
      }
    });
  }
});
